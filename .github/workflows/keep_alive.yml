name: Keep Free Bot Alive 24/7

on:
  schedule:
    # Runs every 10 minutes to prevent Render free instance from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Bot Health Endpoint
        run: |
          URL="${{ secrets.RENDER_BOT_URL }}"
          if [ -z "$URL" ]; then
            echo "RENDER_BOT_URL secret is not set yet. Please set it in repository secrets."
          else
            echo "Pinging $URL/health ..."
            curl -s -f "$URL/health" || echo "Ping failed or server waking up"
          fi
